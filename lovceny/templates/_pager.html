{% if pages > 1 %}
<nav class="pager" aria-label="Stránkování">
  <ul class="pager-list">
    <li>{% if page_prev %}<a class="pager-link" href="{{ page_prev }}" rel="prev">Předchozí</a>{% else %}<span class="pager-link is-disabled" aria-disabled="true">Předchozí</span>{% endif %}</li>
    {% for n, href in page_links %}
    <li>{% if n is none %}<span class="pager-gap" aria-hidden="true">…</span>{% else %}<a class="pager-link" href="{{ href }}" aria-label="{% if n == page %}Strana {{ n }}, aktuální{% else %}Strana {{ n }}{% endif %}"{% if n == page %} aria-current="page"{% endif %}>{{ n }}</a>{% endif %}</li>
    {% endfor %}
    <li>{% if page_next %}<a class="pager-link" href="{{ page_next }}" rel="next">Další</a>{% else %}<span class="pager-link is-disabled" aria-disabled="true">Další</span>{% endif %}</li>
  </ul>
</nav>
{% endif %}
