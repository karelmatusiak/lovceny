name: Probuzení Renderu (keep-alive, záložní)
# Ping lehkého /healthz (nesahá do DB → nebudí Neon). Doporučený způsob je ale externí monitor
# (cron-job.org / UptimeRobot) – viz README „Aby Render neusínal“. Důvody, proč tu cron NENÍ zapnutý:
#  - repozitář je soukromý: každý běh se účtuje jako ≥ 1 minuta z 2 000 min/měsíc zdarma; ping každých
#    10 min = ~4 400 min/měsíc → limit by se vyčerpal a přestalo by běžet i stahování cen (fetch.yml),
#  - GitHub plánované běhy zpožďuje (často 10–30 min) nebo při vytížení vynechává, takže 15min okno
#    Renderu stejně spolehlivě nepokryje.
# Zapnutí (např. pro veřejný repozitář, kde jsou minuty zdarma): odkomentujte `schedule`.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/10 5-21 * * *"   # každých 10 min, 5:00–21:59 UTC (≈ 7–24 h v ČR) – v noci nechat spát
concurrency: { group: keepalive, cancel-in-progress: true }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://lovceny.onrender.com/healthz' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -A 'LovcenyKeepAlive/1.0' "$URL") && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::$URL neodpovídá 200"
