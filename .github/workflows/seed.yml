name: Naplnit databázi (katalog produktů)
# Ruční spuštění: Actions → „Naplnit databázi (katalog produktů)“ → Run workflow.
# Idempotentní – opakované spuštění přidá jen chybějící produkty z seed_catalog.json, nic nezdvojí.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Volby seed.py (např. --no-demo, --dry-run, --category pracky, --limit 10)"
        required: false
        default: "--no-demo"
  # Stejný běh jako ruční Run workflow. client_payload.args je řetězec voleb seed.py.
  repository_dispatch:
    types: [seed-feeds]
concurrency: { group: fetch-prices, cancel-in-progress: false }   # neběží souběžně se stahováním cen
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARGS: ${{ github.event.client_payload.args || inputs.args || '--no-demo' }}
          # --from-feeds čte tyhle adresy. Prázdný secret daný obchod přeskočí.
          ISTYLE_FEED_URL: ${{ secrets.ISTYLE_FEED_URL }}
          SENCOR_FEED_URL: ${{ secrets.SENCOR_FEED_URL }}
          XM_FEED_URL: ${{ secrets.XM_FEED_URL }}
          EVOLVEO_FEED_URL: ${{ secrets.EVOLVEO_FEED_URL }}
          TESLA_FEED_URL: ${{ secrets.TESLA_FEED_URL }}
          XUPE_FEED_URL: ${{ secrets.XUPE_FEED_URL }}
          TERA_FEED_URL: ${{ secrets.TERA_FEED_URL }}
          AMAZESTORE_FEED_URL: ${{ secrets.AMAZESTORE_FEED_URL }}
          MISURA_FEED_URL: ${{ secrets.MISURA_FEED_URL }}
          DYSON_FEED_URL: ${{ secrets.DYSON_FEED_URL }}
          ALLEGRO_FEED_URL: ${{ secrets.ALLEGRO_FEED_URL }}
          BSCOM_FEED_URL: ${{ secrets.BSCOM_FEED_URL }}
          DRONPRO_FEED_URL: ${{ secrets.DRONPRO_FEED_URL }}
          IPHONEMARKET_FEED_URL: ${{ secrets.IPHONEMARKET_FEED_URL }}
        run: python seed.py $ARGS
