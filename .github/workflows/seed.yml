name: Naplnit databázi (katalog produktů)
# Ruční spuštění: Actions → „Naplnit databázi (katalog produktů)“ → Run workflow.
# Idempotentní – opakované spuštění přidá jen chybějící produkty z seed_catalog.json, nic nezdvojí.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Volby seed.py (např. --no-demo, --dry-run, --category pracky, --limit 10)"
        required: false
        default: "--no-demo"
concurrency: { group: fetch-prices, cancel-in-progress: false }   # neběží souběžně se stahováním cen
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARGS: ${{ inputs.args }}
        run: python seed.py $ARGS
