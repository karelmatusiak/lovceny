name: Naplnit databázi (katalog produktů)
# Ruční spuštění: Actions → „Naplnit databázi (katalog produktů)“ → Run workflow.
# Idempotentní – opakované spuštění přidá jen chybějící produkty z seed_catalog.json, nic nezdvojí.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Volby seed.py (např. --no-demo, --dry-run, --category pracky, --limit 10)"
        required: false
        default: "--no-demo"
  # Stejný běh jako ruční Run workflow. client_payload.args je řetězec voleb seed.py.
  repository_dispatch:
    types: [seed-feeds]
concurrency: { group: fetch-prices, cancel-in-progress: false }   # neběží souběžně se stahováním cen
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Stáhnout databázi z R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m lovceny.r2store download --out db/lovceny.db --counts db/counts-before.txt
      - name: Seed
        env:
          DATABASE_URL: sqlite:///db/lovceny.db
          ARGS: ${{ github.event.client_payload.args || inputs.args || '--no-demo' }}
          # --from-feeds čte FEED_URLS. Prázdný nebo rozbitý JSON dané obchody přeskočí.
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python seed.py $ARGS
      - name: Nahrát databázi do R2
        env:
          ARGS: ${{ github.event.client_payload.args || inputs.args || '--no-demo' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          case " $ARGS " in
            *" --dry-run "*) echo "dry-run, databázi nenahrávám"; exit 0 ;;
          esac
          python -m lovceny.r2store publish --path db/lovceny.db --before db/counts-before.txt
