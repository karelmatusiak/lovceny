name: Statický web
on:
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: static-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - name: Vygenerovat web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: https://lovceny.cz
          LOVCENY_SKIP_DATA_FIXES: "1"
          ALZA_AFFILIATE_ID: ${{ secrets.ALZA_AFFILIATE_ID }}
          DATART_AFFILIATE_ID: ${{ secrets.DATART_AFFILIATE_ID }}
          EHUB_AID: ${{ secrets.EHUB_AID }}
          DOGNET_CHID: ${{ secrets.DOGNET_CHID }}
        run: python build_static.py --out dist --report build-report.json
      - name: Nasadit na Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Chybí CLOUDFLARE_API_TOKEN nebo CLOUDFLARE_ACCOUNT_ID, nasazení přeskakuji."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=lovceny --commit-dirty
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Artefakt webu (když se nenasazuje)
        if: steps.deploy.outputs.deployed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lovceny-static
          path: |
            dist
            build-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Report generování
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lovceny-static-report
          path: build-report.json
          if-no-files-found: warn
          retention-days: 14
