name: Statický web
on:
  pull_request:
  workflow_dispatch: {}
  # Denní nasazení je ve Stažení cen, hned po nahrání SQLite do R2.
  # Stejný běh jako ruční Run workflow (workflow 414497804).
  repository_dispatch:
    types: [static-site]
# actions: read stačí. Job neruší běhy ani nezapisuje do Actions API
# (cache i artefakt jedou bez zápisu). Volající fetch.yml zápis nemá
# a volaný workflow oprávnění zvýšit nesmí, jinak se celý běh nespustí.
permissions:
  contents: read
  actions: read
concurrency:
  group: fetch-prices
  cancel-in-progress: false
jobs:
  build:
    # Fork PR nedostane DATABASE_URL. Nasazení je jen z main, ne z pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - name: Affiliate proměnné jen když jsou neprázdné
        env:
          ALZA_AFFILIATE_ID: ${{ secrets.ALZA_AFFILIATE_ID }}
          DATART_AFFILIATE_ID: ${{ secrets.DATART_AFFILIATE_ID }}
          EHUB_AID: ${{ secrets.EHUB_AID }}
          DOGNET_CHID: ${{ secrets.DOGNET_CHID }}
        run: |
          # Chybějící secret je v Actions prázdný řetězec. U eHUB a Dognetu by to
          # vypnulo výchozí kód z repozitáře. Exportujeme jen neprázdnou hodnotu.
          for name in ALZA_AFFILIATE_ID DATART_AFFILIATE_ID EHUB_AID DOGNET_CHID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done
      - name: Stáhnout databázi z R2
        id: snapshot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Web se staví jen ze SQLite v R2. Chybí-li, běh skončí bez Neonu a bez nasazení.
          set +e
          python -m lovceny.r2store download --out snapshot/lovceny.sqlite --counts snapshot/counts.txt
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ] || [ "$code" = "3" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Databáze v R2 není, generování přeskakuji. Neon se nevolá."
          else
            exit "$code"
          fi
      - name: Vygenerovat web ze snapshotu
        if: steps.snapshot.outputs.have == 'true'
        env:
          DATABASE_URL: sqlite:///snapshot/lovceny.sqlite
          PUBLIC_URL: https://lovceny.cz
          LOVCENY_SKIP_DATA_FIXES: "1"
          # Štítek na /obchody čte FEED_URLS. Prázdný secret = „feed URL chybí“.
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python build_static.py --out dist --report build-report.json
      - name: Nasadit na Cloudflare Pages
        id: deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.snapshot.outputs.have == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Chybí CLOUDFLARE_API_TOKEN nebo CLOUDFLARE_ACCOUNT_ID, nasazení přeskakuji."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --branch=main je produkční větev Pages, takže výsledek jde na lovceny.pages.dev.
          # Wrangler hledá functions/ v aktuálním adresáři, ne uvnitř nahrávané složky.
          # Nasazení z kořene by funkci vynechalo a /go/ by zůstal statický HTML 200.
          cd dist
          out=$(npx --yes wrangler@4 pages deploy . --project-name=lovceny --branch=main --commit-dirty)
          printf '%s\n' "$out"
          if [ -d functions ] && ! printf '%s\n' "$out" | grep -q 'Uploading Functions bundle'; then
            echo "dist/functions existuje, ale Wrangler nenahrál Functions bundle." >&2
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Artefakt webu
        if: steps.deploy.outputs.deployed != 'true' && steps.snapshot.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: |
            dist
            build-report.json
          if-no-files-found: error
          retention-days: 14
