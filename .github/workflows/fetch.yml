name: Stažení cen
on:
  schedule:
    - cron: "17 5,11,17 * * *"   # záloha, 3× denně (UTC). Primární budík je repository_dispatch.
  workflow_dispatch: {}
  repository_dispatch:
    types: [fetch-prices]
concurrency:
  group: fetch-prices
  cancel-in-progress: false
# Vestavěný GITHUB_TOKEN smí jen číst kód, číst běhy (ať se cron nezdvojí) a zakládat issues.
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ran: ${{ steps.download.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Přeskočit, pokud už nedávno doběhlo
        id: gate
        # Ruční Run workflow vždy stáhne. Cron a externí budík ne, když úspěch není starší než 3 h.
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          out = os.environ["GITHUB_OUTPUT"]
          def emit(skip):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"skip={'true' if skip else 'false'}\n")
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/fetch.yml/runs?status=success&per_page=5"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lovceny-fetch",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print("Kontrola nedávného běhu selhala, stahování poběží:", exc)
              emit(False)
              raise SystemExit(0)
          now = datetime.now(timezone.utc)
          me = os.environ.get("GITHUB_RUN_ID", "")
          for run in data.get("workflow_runs") or []:
              if str(run.get("id")) == me or run.get("conclusion") != "success":
                  continue
              stamp = run.get("updated_at") or ""
              if not stamp:
                  continue
              done = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              if now - done < timedelta(hours=3):
                  print(f"Úspěšný běh {run.get('id')} skončil {stamp}, tento běh přeskakuji.")
                  emit(True)
                  raise SystemExit(0)
          emit(False)
          PY
      - name: Kontrola importu cen
        # Celé testy jsou ve workflow „Testy“ (push a pull request).
        # Tady jen rychlá brána importu: rozbitý parser feedu nesmí sáhnout na produkční ceny.
        # test_retire_bad_feed_items_removes_filter_offer stahuje živé feedy a patří do Testů.
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pytest -q --tb=no \
            --deselect tests/test_ehub.py::test_retire_bad_feed_items_removes_filter_offer \
            tests/test_feed.py \
            tests/test_dognet.py \
            tests/test_ehub.py
      - name: Stáhnout ceny
        id: download
        if: steps.gate.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALZA_FEED_URL: ${{ secrets.ALZA_FEED_URL }}
          DATART_FEED_URL: ${{ secrets.DATART_FEED_URL }}
          ISTYLE_FEED_URL: ${{ secrets.ISTYLE_FEED_URL }}
          SENCOR_FEED_URL: ${{ secrets.SENCOR_FEED_URL }}
          XM_FEED_URL: ${{ secrets.XM_FEED_URL }}
          EVOLVEO_FEED_URL: ${{ secrets.EVOLVEO_FEED_URL }}
          ELECTRONICSTAR_FEED_URL: ${{ secrets.ELECTRONICSTAR_FEED_URL }}
          FOURHOME_FEED_URL: ${{ secrets.FOURHOME_FEED_URL }}
          ELECTROLUX_FEED_URL: ${{ secrets.ELECTROLUX_FEED_URL }}
          DYSON_FEED_URL: ${{ secrets.DYSON_FEED_URL }}
          ALLEGRO_FEED_URL: ${{ secrets.ALLEGRO_FEED_URL }}
          POCITACE24_FEED_URL: ${{ secrets.POCITACE24_FEED_URL }}
          JBL_FEED_URL: ${{ secrets.JBL_FEED_URL }}
          TESLA_FEED_URL: ${{ secrets.TESLA_FEED_URL }}
          XUPE_FEED_URL: ${{ secrets.XUPE_FEED_URL }}
          TERA_FEED_URL: ${{ secrets.TERA_FEED_URL }}
          AMAZESTORE_FEED_URL: ${{ secrets.AMAZESTORE_FEED_URL }}
          MISURA_FEED_URL: ${{ secrets.MISURA_FEED_URL }}
          BSCOM_FEED_URL: ${{ secrets.BSCOM_FEED_URL }}
          DRONPRO_FEED_URL: ${{ secrets.DRONPRO_FEED_URL }}
          IPHONEMARKET_FEED_URL: ${{ secrets.IPHONEMARKET_FEED_URL }}
          PROMOBILY_FEED_URL: ${{ secrets.PROMOBILY_FEED_URL }}
          EHUB_AID: ${{ secrets.EHUB_AID }}
          DOGNET_CHID: ${{ secrets.DOGNET_CHID }}
          # Upozornění „cena klesla“ odchází odsud (po každém stažení). Bez secretů → jen log.
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND || 'log' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: Lovceny
          # Web Push (upozornění v prohlížeči). Bez klíčů se přeskočí.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:ahoj@lovceny.cz' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://lovceny.cz' }}
        run: python fetch_prices.py --health-out health.json
      - name: Hlídání obchodů (GitHub issue při blokaci / starých cenách)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            exit 0
          fi
          python shop_health_issues.py health.json
  site:
    needs: fetch
    if: always() && needs.fetch.outputs.ran == 'true'
    uses: ./.github/workflows/static.yml
    secrets: inherit
