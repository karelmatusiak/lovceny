name: Stažení cen
on:
  # Jediné hodiny jsou cron-job.org (repository_dispatch). GitHub schedule tu není.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jen spočítat nové produkty, nic nezapisovat"
        type: boolean
        default: false
      create_cap:
        description: "Max nových produktů v jednom běhu"
        type: string
        default: "100"
  repository_dispatch:
    types: [fetch-prices]
concurrency:
  group: fetch-prices
  cancel-in-progress: false
# Vestavěný GITHUB_TOKEN smí jen číst kód, číst běhy (ať se cron nezdvojí) a zakládat issues.
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.download.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Přeskočit, pokud už nedávno doběhlo
        id: gate
        # Ruční Run workflow stáhne vždy. Běžný repository_dispatch ne, když úspěch
        # není starší než 3 h.
        if: github.event_name != 'workflow_dispatch' && github.event.client_payload.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          out = os.environ["GITHUB_OUTPUT"]
          def emit(skip):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"skip={'true' if skip else 'false'}\n")
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/fetch.yml/runs?status=success&per_page=5"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lovceny-fetch",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print("Kontrola nedávného běhu selhala, stahování poběží:", exc)
              emit(False)
              raise SystemExit(0)
          now = datetime.now(timezone.utc)
          me = os.environ.get("GITHUB_RUN_ID", "")
          for run in data.get("workflow_runs") or []:
              if str(run.get("id")) == me or run.get("conclusion") != "success":
                  continue
              stamp = run.get("updated_at") or ""
              if not stamp:
                  continue
              done = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              if now - done < timedelta(hours=3):
                  print(f"Úspěšný běh {run.get('id')} skončil {stamp}, tento běh přeskakuji.")
                  emit(True)
                  raise SystemExit(0)
          emit(False)
          PY
      - name: Kontrola importu cen
        # Celé testy jsou ve workflow „Testy“ (push a pull request).
        # Tady jen rychlá brána importu: rozbitý parser feedu nesmí sáhnout na produkční ceny.
        # test_retire_bad_feed_items_removes_filter_offer stahuje živé feedy a patří do Testů.
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pytest -q --tb=no \
            --deselect tests/test_ehub.py::test_retire_bad_feed_items_removes_filter_offer \
            tests/test_feed.py \
            tests/test_dognet.py \
            tests/test_ehub.py
      - name: Stáhnout databázi z R2
        id: r2
        if: steps.gate.outputs.skip != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m lovceny.r2store download --out db/lovceny.db --counts db/counts-before.txt
      - name: Stáhnout ceny
        # Prázdný secret u soukromého feedu obchod přeskočí. Veřejné defaulty v kódu zůstávají.
        # Databáze je SQLite stažená z R2. Neon se nevolá.
        id: download
        if: steps.gate.outputs.skip != 'true' && steps.r2.outcome == 'success'
        env:
          DATABASE_URL: sqlite:///db/lovceny.db
          ALZA_FEED_URL: ${{ secrets.ALZA_FEED_URL }}
          DATART_FEED_URL: ${{ secrets.DATART_FEED_URL }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
          ELECTRONICSTAR_FEED_URL: ${{ secrets.ELECTRONICSTAR_FEED_URL }}
          FOURHOME_FEED_URL: ${{ secrets.FOURHOME_FEED_URL }}
          ELECTROLUX_FEED_URL: ${{ secrets.ELECTROLUX_FEED_URL }}
          POCITACE24_FEED_URL: ${{ secrets.POCITACE24_FEED_URL }}
          JBL_FEED_URL: ${{ secrets.JBL_FEED_URL }}
          PROMOBILY_FEED_URL: ${{ secrets.PROMOBILY_FEED_URL }}
          EHUB_AID: ${{ secrets.EHUB_AID }}
          DOGNET_CHID: ${{ secrets.DOGNET_CHID }}
          # Upozornění „cena klesla“ odchází odsud (po každém stažení). Bez secretů → jen log.
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND || 'log' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: Lovceny
          # Web Push (upozornění v prohlížeči). Bez klíčů se přeskočí.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:ahoj@lovceny.cz' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://lovceny.cz' }}
        run: |
          args=(--health-out health.json)
          dry="${{ github.event.inputs.dry_run || github.event.client_payload.dry_run }}"
          cap="${{ github.event.inputs.create_cap || github.event.client_payload.create_cap }}"
          if [ "$dry" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$cap" ]; then
            args+=(--create-cap "$cap")
          fi
          python fetch_prices.py "${args[@]}"
      - name: Nahrát databázi do R2
        if: steps.download.outcome == 'success' && github.event.inputs.dry_run != 'true' && github.event.client_payload.dry_run != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m lovceny.r2store publish --path db/lovceny.db --before db/counts-before.txt
      - name: Hlídání obchodů (GitHub issue při blokaci / starých cenách)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.gate.outputs.skip }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event.client_payload.dry_run }}" = "true" ]; then
            exit 0
          fi
          python shop_health_issues.py health.json
  site:
    needs: fetch
    if: needs.fetch.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - name: Stáhnout databázi z R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m lovceny.r2store download --out db/lovceny.db --counts db/counts.txt
      - name: Vygenerovat web ze SQLite
        timeout-minutes: 15
        env:
          DATABASE_URL: sqlite:///db/lovceny.db
          PUBLIC_URL: https://lovceny.cz
          LOVCENY_SKIP_DATA_FIXES: "1"
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python build_static.py --out dist --report build-report.json
      - name: Nasadit na Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Chybí CLOUDFLARE_API_TOKEN nebo CLOUDFLARE_ACCOUNT_ID. Web se nenasadil." >&2
            exit 1
          fi
          cd dist
          out=$(npx --yes wrangler@4 pages deploy . --project-name=lovceny --branch=main --commit-dirty)
          printf '%s\n' "$out"
          if [ -d functions ] && ! printf '%s\n' "$out" | grep -q 'Uploading Functions bundle'; then
            echo "dist/functions existuje, ale Wrangler nenahrál Functions bundle." >&2
            exit 1
          fi
