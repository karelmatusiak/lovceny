name: Stažení cen
on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3× denně (UTC)
  workflow_dispatch: {}
concurrency: { group: fetch-prices, cancel-in-progress: false }
# Vestavěný GITHUB_TOKEN smí jen číst kód a zakládat/zavírat issues (monitoring blokací obchodů).
permissions:
  contents: read
  issues: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Stáhnout ceny
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALZA_FEED_URL: ${{ secrets.ALZA_FEED_URL }}
          DATART_FEED_URL: ${{ secrets.DATART_FEED_URL }}
          # Upozornění „cena klesla“ odchází odsud (po každém stažení). Bez secretů → jen log.
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND || 'log' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: Lovceny
          # Web Push (upozornění v prohlížeči). Bez klíčů se přeskočí.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:ahoj@lovceny.cz' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://lovceny.onrender.com' }}
        run: python fetch_prices.py --health-out health.json
      - name: Hlídání obchodů (GitHub issue při blokaci / starých cenách)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python shop_health_issues.py health.json
