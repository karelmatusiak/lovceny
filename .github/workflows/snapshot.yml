name: Snapshot katalogu
# Kanónická databáze je lovceny.db v R2. Tenhle workflow už Neon nečte
# a nic nenahrává. Zůstává, aby starý odkaz v Actions nespadl na chybějící soubor.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snímek z Neonu se nedělá
        run: echo "Databáze je soubor lovceny.db v R2. Neon se nevolá."
