services:
  - type: web
    name: lovceny
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lovceny.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # vložit ručně (Neon connection string)
      - key: EMAIL_BACKEND
        value: log
      - key: ALZA_AFFILIATE_ID
        sync: false
      - key: DATART_AFFILIATE_ID
        sync: false
