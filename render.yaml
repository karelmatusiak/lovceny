services:
  - type: web
    name: lovceny
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lovceny.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # vložit ručně (Neon connection string)
      # E-maily (potvrzení hlídání): Brevo free tier. Bez BREVO_API_KEY/EMAIL_FROM se jen logují.
      - key: EMAIL_BACKEND
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false   # ověřený odesílatel v Brevu, např. upozorneni@lovceny.cz
      - key: EMAIL_FROM_NAME
        value: Lovceny
      - key: PUBLIC_URL
        value: https://lovceny.cz
      # Web Push (upozornění v prohlížeči). Bez obou klíčů je funkce skrytá.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:info@lovceny.cz
      - key: ALZA_AFFILIATE_ID
        sync: false
      - key: DATART_AFFILIATE_ID
        sync: false
      # eHUB affiliate (Smarty/iStyle/Sencor/XM.cz/EVOLVEO/Počítače24/JBL). Prázdné = vypnuto; jinak výchozí AID v kódu.
      - key: EHUB_AID
        sync: false
      - key: LOVCENY_AFFILIATE
        sync: false
      - key: ISTYLE_FEED_URL
        sync: false
      - key: SENCOR_FEED_URL
        sync: false
      - key: XM_FEED_URL
        sync: false
      - key: EVOLVEO_FEED_URL
        sync: false
      # Dognet (Electronic-star, 4Home, Electrolux, Dyson, Allegro). Prázdné DOGNET_CHID = vypnuto; jinak výchozí chid v kódu.
      - key: DOGNET_CHID
        sync: false
      - key: ELECTRONICSTAR_FEED_URL
        sync: false
      - key: FOURHOME_FEED_URL
        sync: false
      - key: ELECTROLUX_FEED_URL
        sync: false
      - key: DYSON_FEED_URL
        sync: false
      - key: ALLEGRO_FEED_URL
        sync: false
      # Soukromé feedy bez defaultu v gitu. Prázdné = obchod se přeskočí.
      - key: TESLA_FEED_URL
        sync: false
      - key: XUPE_FEED_URL
        sync: false
      - key: TERA_FEED_URL
        sync: false
      - key: AMAZESTORE_FEED_URL
        sync: false
      - key: MISURA_FEED_URL
        sync: false
      - key: BSCOM_FEED_URL
        sync: false
      - key: DRONPRO_FEED_URL
        sync: false
      - key: IPHONEMARKET_FEED_URL
        sync: false
      - key: POCITACE24_FEED_URL
        sync: false
      - key: JBL_FEED_URL
        sync: false
      # AI hledání – Google Gemini, jen FREE tier (klíč z AI Studia bez billingu). Bez klíče běží hledání bez AI.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DAILY_CAP
        value: "900"
      # Admin /admin a /admin/trideni. Bez ADMIN_TOKEN (nebo kratšího než 16 znaků) obě stránky vrací 404.
      - key: ADMIN_TOKEN
        sync: false
      - key: IMG_CACHE_MAX_MB
        value: "40"
      - key: IMG_CONCURRENCY
        value: "1"
