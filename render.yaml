services:
  - type: web
    name: lovceny
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lovceny.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # vložit ručně (Neon connection string)
      # E-maily (potvrzení hlídání): Brevo free tier. Bez BREVO_API_KEY/EMAIL_FROM se jen logují.
      - key: EMAIL_BACKEND
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false   # ověřený odesílatel v Brevu, např. upozorneni@lovceny.cz
      - key: EMAIL_FROM_NAME
        value: Lovceny
      - key: PUBLIC_URL
        value: https://lovceny.onrender.com   # po napojení domény změnit na https://lovceny.cz
      # Web Push (upozornění v prohlížeči). Bez obou klíčů je funkce skrytá.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:ahoj@lovceny.cz
      - key: ALZA_AFFILIATE_ID
        sync: false
      - key: DATART_AFFILIATE_ID
        sync: false
      # AI hledání – Google Gemini, jen FREE tier (klíč z AI Studia bez billingu). Bez klíče běží hledání bez AI.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DAILY_CAP
        value: "900"
